<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metaverso Grupo Vandic Rocha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Um único mundo noturno: a interface é sempre "vidro escuro" sobre a cena 3D. */
  :root {
    color-scheme: dark;
    --night: #0B1026;
    --glass: rgba(13, 19, 44, 0.80);
    --glass-strong: rgba(13, 19, 44, 0.92);
    --line: rgba(244, 239, 228, 0.14);
    --ink: #F4EFE4;
    --muted: #AEB5CC;
    --gold: #F2C230;
    --red: #C8322B;
    --green: #2FA160;
    --blue: #4C7FD0;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font: 14px/1.45 var(--body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .panel {
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 14px;
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
  }

  /* Marca */
  .brand {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 16px;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px 10px 10px;
    max-width: calc(100vw - 32px - 160px);
  }
  .tiles { display: grid; grid-template-columns: repeat(2, 13px); gap: 2px; flex: none; }
  .tiles i { width: 13px; height: 13px; border-radius: 2px; display: block; }
  .brand-eyebrow {
    margin: 0; font: 500 10.5px/1.2 var(--mono);
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-name {
    margin: 2px 0 0; font: 800 21px/1 var(--display);
    letter-spacing: -0.01em; white-space: nowrap;
  }
  .brand-name em { font-style: normal; color: var(--gold); }

  /* Mapa e controles */
  .tools {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 16px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .map { padding: 6px; line-height: 0; }
  #minimap { width: 144px; height: 144px; border-radius: 9px; display: block; }
  .tool-row { display: flex; gap: 6px; }
  .tbtn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; font-size: 12.5px; font-weight: 500;
    cursor: pointer;
  }
  .tbtn:hover { border-color: rgba(242, 194, 48, 0.55); }
  .tbtn svg { width: 14px; height: 14px; }
  #vrslot:empty { display: none; }
  #vrslot button {
    position: static !important; width: auto !important; left: auto !important; bottom: auto !important;
    padding: 7px 11px !important; font: 500 12.5px var(--body) !important;
    border-radius: 14px !important; background: var(--glass) !important;
    border: 1px solid var(--line) !important; color: var(--ink) !important; opacity: 1 !important;
  }

  /* Ficha do local */
  .card {
    position: fixed;
    top: calc(96px + env(safe-area-inset-top, 0px));
    left: 16px;
    width: min(340px, calc(100vw - 32px));
    max-height: calc(100% - 200px);
    overflow: auto;
    padding: 16px 18px 18px;
    background: var(--glass-strong);
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .eyebrow {
    margin: 0; font: 500 11px/1.3 var(--mono);
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold);
  }
  .close {
    flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0;
    border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
  }
  .close:hover { color: var(--ink); border-color: var(--line); }
  .card h2 {
    margin: 6px 0 8px; font: 700 26px/1.05 var(--display);
    letter-spacing: -0.015em; text-wrap: balance;
  }
  .card p.text { margin: 0; color: #D9DCE8; max-width: 62ch; }
  .facts {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line);
  }
  .facts div { min-width: 0; }
  .facts dt {
    font: 500 10px/1.3 var(--mono); letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .facts dd {
    margin: 3px 0 0; font: 700 16px/1.15 var(--display);
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .extra:empty { display: none; }
  .extra { margin-top: 14px; }
  .coins { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
  .coin-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 2px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03); cursor: pointer;
    font: 500 10px/1 var(--mono); letter-spacing: 0.04em;
  }
  .coin-btn:hover { border-color: rgba(242, 194, 48, 0.55); }
  .coin-btn img { width: 34px; height: 34px; border-radius: 50%; }
  .token { display: flex; gap: 14px; align-items: center; }
  .token img { width: 72px; height: 72px; border-radius: 50%; flex: none; }
  .addr {
    display: block; margin-top: 10px; padding: 9px 10px; border-radius: 9px;
    background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line);
    font: 400 12px/1.4 var(--mono); overflow-wrap: anywhere; user-select: all;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .act {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05);
    font-size: 13px; font-weight: 500; color: var(--ink); text-decoration: none; cursor: pointer;
  }
  .act.primary { background: var(--gold); color: #1A1406; border-color: var(--gold); }
  .act:hover { filter: brightness(1.1); }

  /* Locais */
  .places {
    position: fixed; left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; padding: 2px 16px;
    overflow-x: auto; justify-content: safe center;
    scrollbar-width: none;
  }
  .places::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px; cursor: pointer;
    font-weight: 500; font-size: 13.5px; white-space: nowrap;
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .chip[aria-current="true"] { background: var(--ink); color: #111630; border-color: var(--ink); }
  .chip[aria-current="true"] i { box-shadow: 0 0 0 1.5px #111630; }

  .hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    padding: 7px 12px; font: 400 12px/1.3 var(--mono); color: var(--muted);
    white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
    transition: opacity .6s;
  }
  .hint kbd { font: inherit; color: var(--ink); }

  /* Joystick (telas de toque) */
  .joy {
    position: fixed; left: 24px; bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    width: 116px; height: 116px; border-radius: 50%;
    background: rgba(13, 19, 44, 0.55); border: 1px solid var(--line);
    touch-action: none;
  }
  .knob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px;
    margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(242, 194, 48, 0.9); box-shadow: 0 0 18px rgba(242, 194, 48, 0.5);
  }

  @media (max-width: 640px) {
    .brand { padding: 8px 12px 8px 8px; gap: 10px; max-width: calc(100vw - 32px - 112px); }
    .brand-name { font-size: 17px; }
    #minimap { width: 96px; height: 96px; }
    .tbtn span { display: none; }
    .card {
      top: auto; left: 16px; right: 16px; width: auto;
      bottom: calc(66px + env(safe-area-inset-bottom, 0px));
      max-height: 40%;
    }
    .card h2 { font-size: 22px; }
    .facts dd { font-size: 14px; }
    .hint { display: none; }
    .places { justify-content: flex-start; }
  }
  @media (max-width: 640px) and (pointer: coarse) {
    .card { bottom: calc(214px + env(safe-area-inset-bottom, 0px)); max-height: 30%; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="Cena 3D do metaverso: Lapa, Glória e a Torre do Grupo Vandic Rocha"></div>

<header class="brand panel">
  <div class="tiles" aria-hidden="true">
    <i style="background:#C8322B"></i><i style="background:#F2C230"></i>
    <i style="background:#1E8A4C"></i><i style="background:#2B5FA8"></i>
  </div>
  <div>
    <p class="brand-eyebrow">Grupo Vandic Rocha · Rio de Janeiro</p>
    <p class="brand-name">Metaverso <em>Lapa</em></p>
  </div>
</header>

<div class="tools">
  <div class="map panel"><canvas id="minimap" width="288" height="288" aria-label="Mapa da região"></canvas></div>
  <div class="tool-row">
    <div id="vrslot"></div>
    <button id="daynight" class="tbtn panel" type="button" aria-pressed="false" title="Alternar dia e noite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span id="dnLabel">Noite</span>
    </button>
  </div>
</div>

<aside id="card" class="card panel" aria-live="polite">
  <div class="card-head">
    <p id="cardEyebrow" class="eyebrow"></p>
    <button id="cardClose" class="close" type="button" aria-label="Fechar ficha">×</button>
  </div>
  <h2 id="cardTitle"></h2>
  <p id="cardText" class="text"></p>
  <dl id="cardFacts" class="facts"></dl>
  <div id="cardExtra" class="extra"></div>
</aside>

<p id="hint" class="hint panel"><kbd>W A S D</kbd> ou setas para andar · <kbd>Shift</kbd> corre · arraste para girar · clique nas moedas</p>

<nav id="places" class="places" aria-label="Ir para um local"></nav>

<div id="joy" class="joy" hidden><div id="knob" class="knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ------------------------------------------------------------------ dados */

const TOKENS = [
  { sym: 'LAPA',   name: 'Lapa Coin',            addr: '0xC12e14135b82305637e4F3c2FE4eaB7739854D10', note: 'Tokenizada pelo GVR. Na moeda: os Arcos, a Escadaria Selarón, o bonde e a roda de samba.' },
  { sym: 'SET',    name: 'Moeda Setfrio',        addr: '0x6779eF4dE8343Dd8DA82158410D3934F68603f65', note: 'Setfrio Engenharia de Ar Condicionado.' },
  { sym: 'PTR',    name: 'Moeda Petrorio',       addr: '0xB9dFF02ba6d2BE0a3A49382f983D87ddaAd804B4', note: 'Petrorio Comércio, Importação e Serviços: naval, industrial e offshore.' },
  { sym: 'PTF',    name: 'Moeda Petrofrio',      addr: '0xD0Af1bD51ee0132858A172D41eC769e1e3Cf9c11', note: 'Petrofrio Refrigeração e Offshore.' },
  { sym: 'PET',    name: 'Pet Resgate',          addr: '0x544510c97944b0579B27c4a7FBB76412b1336601', note: 'Resgate e cuidado animal.' },
  { sym: 'HVAC-R', name: 'Moeda HVAC-R',         addr: '0x4c3d87d7faaf04e17c9de0afbce4687aa7793995', note: 'Setor HVAC-R Brasil.' },
  { sym: 'AVAC-R', name: 'AVAC-R 2026',          addr: '0x935CbCb59719dAC5DDc72c6d9e11b95f18834876', note: 'Aquecimento, ventilação, ar condicionado e refrigeração.' },
  { sym: 'AVAC',   name: 'AVAC-R Coin Inc.',     addr: '0x2fe3c7dd588a1258f032a776e33266aed46256f0', note: 'Emissão institucional AVAC-R.' },
  { sym: 'GCC',    name: 'GVR Carbon Credit',    addr: '0x83Df478CB43c95dAab29259A6c308C157D62a2E7', note: 'Crédito de carbono do Grupo Vandic Rocha.' },
  { sym: 'VGI',    name: 'Vandic Global Index',  addr: '0xd78342A74D251891d9Daa6D709fC3bab5803c78A', note: 'Índice global do grupo.' },
  { sym: 'GVRA',   name: 'GVR Access',           addr: null, note: 'Moeda de acesso do Grupo Vandic Rocha, emissão 2026.' },
];

const PLACES = [
  {
    id: 'arcos', name: 'Arcos da Lapa', dot: '#F4EFE4',
    eyebrow: 'Aqueduto da Carioca · concluído em 1750',
    text: 'O antigo aqueduto levava a água do rio Carioca ao centro da cidade. Desde 1896 os trilhos lá em cima são do bonde de Santa Teresa, que atravessa os arcos o tempo todo aqui no metaverso.',
    facts: [['Arcos', '42'], ['Extensão', '270 m'], ['Altura', '17,6 m']],
    center: [0, 0], radius: 42, spawn: [0, 0, 22], face: [0, -1],
  },
  {
    id: 'selaron', name: 'Escadaria Selarón', dot: '#C8322B',
    eyebrow: 'Lapa → Santa Teresa · desde 1990',
    text: 'O artista chileno Jorge Selarón cobriu os degraus com azulejos do mundo inteiro. Verde, amarelo e azul homenageiam o Brasil; o vermelho lembra o Chile. Suba até Santa Teresa.',
    facts: [['Degraus', '215'], ['Extensão', '125 m'], ['Azulejos', '+2.000']],
    center: [-95, -10], radius: 30, spawn: [-95, 0, 26], face: [0, -1],
  },
  {
    id: 'passeio', name: 'Passeio Público', dot: '#2FA160',
    eyebrow: 'Mestre Valentim · aberto em 1783',
    text: 'Considerado o primeiro jardim público das Américas. No centro fica o Chafariz dos Jacarés; no terraço, as pirâmides "Saudade do Rio" e "Amor do Público".',
    facts: [['Abertura', '1783'], ['Projeto', 'M. Valentim'], ['Chafariz', 'Jacarés']],
    center: [80, 55], radius: 30, spawn: [80, 0, 27], face: [0, 1],
  },
  {
    id: 'feira', name: 'Feira da Glória', dot: '#F2C230',
    eyebrow: 'Glória · domingo de manhã',
    text: 'A feira livre de domingo da Glória: hortifruti, flores, peixe, queijos, pastel e caldo de cana. As barracas ocupam a rua inteira.',
    facts: [['Dia', 'Domingo'], ['Turno', 'Manhã'], ['Barracas', '16']],
    center: [25, 100], radius: 42, spawn: [-26, 0, 100], face: [1, 0],
  },
  {
    id: 'torre', name: 'Torre Vandic Rocha', dot: '#4C7FD0',
    eyebrow: 'Sede do Grupo Vandic Rocha',
    text: 'A Setfrio (climatização VRF/VRV, manutenção e PMOC), a Petrorio e a Petrofrio ocupam os andares. Na cobertura fica o escritório virtual da Lapa Coin. Pise no círculo dourado da entrada para subir.',
    facts: [['Andares', '14'], ['Empresas', '3'], ['Cobertura', 'Lapa Coin']],
    center: [60, -40], radius: 22, spawn: [60, 0, -20], face: [0, -1],
  },
  {
    id: 'escritorio', name: 'Escritório Lapa Coin', dot: '#F2C230',
    eyebrow: 'Cobertura · BNB Smart Chain',
    text: 'As onze moedas do grupo giram em volta do núcleo. Toque em uma moeda para ver o contrato. O círculo dourado ao lado leva de volta à rua.',
    facts: [['Moedas', '11'], ['Rede', 'BSC'], ['Padrão', 'BEP-20']],
    center: [60, -45], radius: 0, spawn: [60, 56, -40.5], face: [0, -1],
  },
];

/* ------------------------------------------------------------ utilidades */

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1750);
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

function canvasTex(w, h, draw, { repeat = null, srgb = true } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function repeated(tex, rx, ry) {
  const t = tex.clone();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.needsUpdate = true;
  return t;
}

await Promise.race([
  Promise.all([
    document.fonts.load('800 64px "Bricolage Grotesque"'),
    document.fonts.load('500 32px "IBM Plex Mono"'),
  ]),
  new Promise((r) => setTimeout(r, 1800)),
]).catch(() => {});

/* ------------------------------------------------------ renderer e cena */

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.xr.enabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.fog = new THREE.FogExp2(0x0d1330, 0.0022);

const rig = new THREE.Group();
scene.add(rig);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2500);
rig.add(camera);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* luzes */
const hemi = new THREE.HemisphereLight(0x2a3a6a, 0x1a1510, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0x9fb4ff, 0.6);
sun.position.set(-80, 140, 70);
sun.target.position.set(0, 0, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 1, far: 500 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);

/* céu */
const skyUniforms = {
  uTop: { value: new THREE.Color('#050a1f') },
  uHorizon: { value: new THREE.Color('#2a2150') },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1400, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: skyUniforms,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 uTop; uniform vec3 uHorizon; varying vec3 vDir; void main(){ float h = clamp(vDir.y, 0.0, 1.0); vec3 c = mix(uHorizon, uTop, pow(h, 0.55)); if (vDir.y < 0.0) c = uHorizon * 0.7; gl_FragColor = vec4(c, 1.0); }',
  })
);
scene.add(sky);

const stars = (() => {
  const n = 1600, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = rand() * Math.PI * 2, ph = Math.acos(rand() * 0.95);
    p[i * 3] = Math.sin(ph) * Math.cos(th) * 1300;
    p[i * 3 + 1] = Math.cos(ph) * 1300;
    p[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * 1300;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, color: 0xffffff, fog: false, transparent: true, opacity: 0.85 }));
})();
scene.add(stars);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(18, 24, 16),
  new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 2.2, 2.0), fog: false })
);
moon.position.set(-520, 620, -900);

const PAL = { red: '#C8322B', yellow: '#F2C230', green: '#1E8A4C', blue: '#2B5FA8', white: '#F4EFE4', black: '#1b1b1f' };

function drawTile(g, x, y, s, base) {
  g.fillStyle = base; g.fillRect(x, y, s, s);
  const accent = pick([PAL.white, PAL.yellow, PAL.blue, PAL.black, PAL.red, PAL.green]);
  g.fillStyle = accent; g.strokeStyle = accent; g.lineWidth = s * 0.07;
  const kind = Math.floor(rand() * 7);
  const c = s / 2;
  if (kind === 0) { g.beginPath(); g.arc(x + c, y + c, s * 0.28, 0, Math.PI * 2); g.fill(); }
  else if (kind === 1) { g.beginPath(); g.moveTo(x + c, y + s * 0.12); g.lineTo(x + s * 0.88, y + c); g.lineTo(x + c, y + s * 0.88); g.lineTo(x + s * 0.12, y + c); g.closePath(); g.fill(); }
  else if (kind === 2) { g.strokeRect(x + s * 0.16, y + s * 0.16, s * 0.68, s * 0.68); }
  else if (kind === 3) { for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { g.beginPath(); g.arc(x + s * (0.2 + i * 0.3), y + s * (0.2 + j * 0.3), s * 0.06, 0, 7); g.fill(); } }
  else if (kind === 4) { g.fillStyle = PAL.white; g.fillRect(x, y, s, s); g.strokeStyle = PAL.blue; g.lineWidth = s * 0.05; g.beginPath(); g.arc(x, y, s * 0.5, 0, 7); g.arc(x + s, y + s, s * 0.5, 0, 7); g.stroke(); g.beginPath(); g.arc(x + c, y + c, s * 0.14, 0, 7); g.fillStyle = PAL.blue; g.fill(); }
  else if (kind === 5) { g.beginPath(); g.moveTo(x, y + s); g.lineTo(x + s, y); g.stroke(); }
  // kind 6: azulejo liso
  g.strokeStyle = 'rgba(245,242,235,0.95)'; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, s - 3, s - 3);
}

function facadePair(seed) {
  const r = mulberry32(seed);
  const lit = [];
  const map = canvasTex(256, 256, (g) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 256, 256);
    for (let fy = 0; fy < 4; fy++) for (let bx = 0; bx < 4; bx++) {
      const x = bx * 64 + 18, y = fy * 64 + 12;
      g.fillStyle = '#e9e4da'; g.fillRect(x - 5, y - 5, 38, 52);
      g.fillStyle = '#2b2f3c'; g.beginPath(); g.moveTo(x, y + 42); g.lineTo(x, y + 12); g.arc(x + 14, y + 12, 14, Math.PI, 0); g.lineTo(x + 28, y + 42); g.closePath(); g.fill();
      g.fillStyle = '#3f6b52'; g.fillRect(x - 4, y + 6, 4, 36); g.fillRect(x + 28, y + 6, 4, 36);
      g.fillStyle = '#d8d2c6'; g.fillRect(x - 6, y + 42, 40, 4);
      lit.push(r() < 0.45);
    }
    g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(0, 60, 256, 3); g.fillRect(0, 124, 256, 3); g.fillRect(0, 188, 256, 3);
  });
  const emissive = canvasTex(256, 256, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
    let k = 0;
    for (let fy = 0; fy < 4; fy++) for (let bx = 0; bx < 4; bx++) {
      if (lit[k++]) {
        const x = bx * 64 + 18, y = fy * 64 + 12;
        g.fillStyle = r() < 0.7 ? '#ffc977' : '#ffe7b8';
        g.beginPath(); g.moveTo(x, y + 42); g.lineTo(x, y + 12); g.arc(x + 14, y + 12, 14, Math.PI, 0); g.lineTo(x + 28, y + 42); g.closePath(); g.fill();
      }
    }
  });
  return { map, emissive };
}

function building(x, z, w, d, h, color, base = 0) {
  const f = facades[Math.floor(rand() * facades.length)];
  const rx = Math.max(1, Math.round(w / 12)), ry = Math.max(1, Math.round(h / 12));
  const side = new THREE.MeshStandardMaterial({
    color, roughness: 0.85,
    map: repeated(f.map, rx, ry),
    emissive: 0xffffff, emissiveMap: repeated(f.emissive, rx, ry), emissiveIntensity: 1.2,
  });
  const sideD = new THREE.MeshStandardMaterial({
    color, roughness: 0.85,
    map: repeated(f.map, Math.max(1, Math.round(d / 12)), ry),
    emissive: 0xffffff, emissiveMap: repeated(f.emissive, Math.max(1, Math.round(d / 12)), ry), emissiveIntensity: 1.2,
  });
  nightMats.push(side, sideD);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [sideD, sideD, terracotta, terracotta, side, side]);
  m.position.set(x, base + h / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  // telhado em duas águas
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.01, Math.min(w, d) * 0.62, 2.2, 4, 1), terracotta);
  roof.rotation.y = Math.PI / 4;
  roof.scale.set(w / Math.min(w, d), 1, d / Math.min(w, d));
  roof.position.set(x, base + h + 1.1, z);
  roof.castShadow = true;
  scene.add(roof);
  colliders.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, h: base + h });
  return m;
}

function signTex(text, { w = 1024, h = 160, fg = '#F4EFE4', bg = null, font = '800 96px "Bricolage Grotesque", sans-serif', pad = 0 } = {}) {
  return canvasTex(w, h, (g) => {
    if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(pad, pad, w - pad * 2, h - pad * 2, (h - pad * 2) / 2); g.fill(); }
    g.fillStyle = fg; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, h / 2 + 4, w - 40);
  });
}

  scene.add(s);

}

function archShape(W, H, open, springY) {
  const r = open / 2, s = new THREE.Shape();
  s.moveTo(-W / 2, 0); s.lineTo(-r, 0); s.lineTo(-r, springY);

  return s;
}

function groundHeight(x, z) {
  let h = 0;
  if (x > STAIR.x - STAIR.half && x < STAIR.x + STAIR.half && z <= STAIR.z0 && z > STAIR.z0 - STAIR.n) {
    const i = Math.floor(STAIR.z0 - z);
    h = Math.min(STAIR.n, i + 1) * STAIR.rise;
  }
  if (x > -140 && x < -60 && z <= STAIR.z0 - STAIR.n && z > -110) h = Math.max(h, 15);
  for (const c of colliders) if (x > c.x0 && x < c.x1 && z > c.z0 && z < c.z1) h = Math.max(h, c.h);
  return h;
}

});

    drag.x = e.clientX; drag.y = e.clientY;
    state.yaw -= dx * 0.0055;

    canvas.style.cursor = hit ? 'pointer' : 'grab';

});
function endDrag(e) {
  if (!drag || drag.id !== e.pointerId) return;
  const tap = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7 && performance.now() - drag.t < 450;
  drag = null;
  if (tap) {
    const hit = pickAt(e.clientX, e.clientY);
    if (hit && hit.token) { cardDismissed = false; showToken(hit.token); }
    else if (hit && hit.place) { cardDismissed = false; showPlace(PLACES.find((q) => q.id === hit.place)); }
  }
}

function pickAt(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  for (const h of hits) {
    if (h.distance > 260) break;
    if (h.object.userData.token) return { token: h.object.userData.token };
    if (h.object.userData.place) return { place: h.object.userData.place };
  }
  return null;
}

const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), camTarget = new THREE.Vector3();
let lastPad = null, walkPhase = 0;
const hint = $('hint');

teleport(0, 0, 22, 0, -1);

function nearestPlace() {
  if (avatar.position.y > 40) return 'escritorio';
  let best = null, bd = Infinity;
  for (const p of PLACES) {
    if (!p.radius) continue;
    const d = Math.hypot(avatar.position.x - p.center[0], avatar.position.z - p.center[1]);
    if (d < p.radius && d < bd) { bd = d; best = p.id; }
  }
  return best;
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // movimento
  let ix = joyVec.x, iy = joyVec.y;
  if (keys.has('w') || keys.has('arrowup')) iy += 1;
  if (keys.has('s') || keys.has('arrowdown')) iy -= 1;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;
  const len = Math.hypot(ix, iy);
  const p = avatar.position;
  if (len > 0.05 && !renderer.xr.isPresenting) {
    if (len > 1) { ix /= len; iy /= len; }
    const speed = keys.has('shift') ? 17 : 9;
    fwd.set(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    right.set(Math.cos(state.yaw), 0, -Math.sin(state.yaw));
    const mx = (fwd.x * iy + right.x * ix) * speed * dt;
    const mz = (fwd.z * iy + right.z * ix) * speed * dt;
    if (groundHeight(p.x + mx, p.z) - p.y <= 1.2) p.x += mx;
    if (groundHeight(p.x, p.z + mz) - p.y <= 1.2) p.z += mz;
    if (p.y > 40) {
      p.x = THREE.MathUtils.clamp(p.x, TOWER.x - 9.4, TOWER.x + 9.4);
      p.z = THREE.MathUtils.clamp(p.z, TOWER.z - 9.4, TOWER.z + 9.4);
    }
    p.x = THREE.MathUtils.clamp(p.x, -145, 148);
    p.z = THREE.MathUtils.clamp(p.z, -115, 175);
    const targetRot = Math.atan2(mx, mz);
    let dr = targetRot - avatar.rotation.y;
    dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    avatar.rotation.y += dr * Math.min(1, dt * 12);
    walkPhase += dt * speed * 1.4;
    if (!moved) { moved = true; hint.style.opacity = '0'; setTimeout(() => { hint.hidden = true; }, 700); }
  }
  const gh = groundHeight(p.x, p.z);
  p.y += (gh - p.y) * Math.min(1, dt * (gh > p.y ? 16 : 9));
  avatar.children[0].position.y = 0.9 + (len > 0.05 ? Math.abs(Math.sin(walkPhase)) * 0.08 : 0);

  // elevador
  const onUp = Math.hypot(p.x - PAD_UP.x, p.z - PAD_UP.z) < 1.3 && p.y < 2;
  const onDown = Math.hypot(p.x - PAD_DOWN.x, p.z - PAD_DOWN.z) < 1.3 && p.y > 50;
  const padNow = onUp ? 'up' : onDown ? 'down' : null;
  if (padNow && padNow !== lastPad) {
    if (padNow === 'up') { goTo('escritorio'); lastPad = null; }
    else { teleport(PAD_UP.x, 0, PAD_UP.z + 5, 0, 1); lastPad = null; setPlace('torre', true); }
  } else lastPad = padNow;

  // local atual
  const np = nearestPlace();
  if (np && np !== currentPlace) { cardDismissed = false; setPlace(np); }

  // animações
  const anim = reduced ? 0.25 : 1;
  const bx = Math.sin(t * 0.09 * anim) * 56;
  const vx = Math.cos(t * 0.09 * anim);
  bonde.position.x = bx;
  bonde.rotation.y = vx >= 0 ? 0 : Math.PI;
  coinGroup.rotation.y = t * 0.25 * anim;
  coinGroup.children.forEach((c) => {
    if (c.userData.angle === undefined) return;
    c.children[0].rotation.z = t * 0.8 * anim;
    c.position.y = Math.sin(c.userData.angle * 2 + t * 1.2 * anim) * 0.35;
  });
  core.rotation.set(t * 0.4 * anim, t * 0.6 * anim, 0);
  for (const s of spinners) s.rotation.y = t * 9 * anim;
  waterUniforms.uTime.value = t * anim;

  // câmera
  if (renderer.xr.isPresenting) {
    rig.position.set(p.x, p.y, p.z);
    renderer.render(scene, camera);
    return;
  }
  camTarget.set(p.x, p.y + 1.6, p.z);
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const dist = p.y > 40 ? Math.min(state.dist, 6) : state.dist;
  camera.position.set(
    camTarget.x + Math.sin(state.yaw) * cp * dist,
    camTarget.y + sp * dist,
    camTarget.z + Math.cos(state.yaw) * cp * dist
  );
  const minY = groundHeight(camera.position.x, camera.position.z) + 0.6;
  if (camera.position.y < minY && minY < camTarget.y + 6) camera.position.y = minY;
  camera.lookAt(camTarget);

  drawMinimap();
  composer.render();
}
renderer.setAnimationLoop(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});
</script>
</body>
